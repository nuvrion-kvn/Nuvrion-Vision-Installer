<g font-family="Segoe UI,DejaVu Sans,Arial,sans-serif"><text x="52" y="54" font-size="18" fill="#71e5d5" font-weight="600">NUVRION  /  1.0.0</text><text x="52" y="108" font-size="37" fill="#f5f9fc" font-weight="600">Vision Installer · схема работы</text><text x="52" y="147" font-size="22" fill="#b9ccdf" font-weight="400">Единственный внешний TCP/443 → Xray → VPN или обычный HTTPS</text><rect x="52" y="215" width="245" height="152" rx="16" fill="#15263b" stroke="#375069"/><text x="74" y="252" font-size="22" fill="#edf5fb" font-weight="600">Клиент</text><text x="74" y="284" font-size="18" fill="#b9ccdf" font-weight="400">VPN: VLESS + Vision</text><text x="74" y="312" font-size="18" fill="#b9ccdf" font-weight="400">Браузер: HTTPS</text><rect x="375" y="215" width="275" height="152" rx="16" fill="#163336" stroke="#71e5d5"/><text x="397" y="252" font-size="22" fill="#71e5d5" font-weight="600">Xray · TCP/443</text><text x="397" y="284" font-size="18" fill="#b9ccdf" font-weight="400">TLS 1.3 · сертификат</text><text x="397" y="312" font-size="18" fill="#b9ccdf" font-weight="400">Разбор подключения</text><rect x="765" y="190" width="583" height="95" rx="16" fill="#15263b" stroke="#375069"/><text x="787" y="227" font-size="22" fill="#edf5fb" font-weight="600">VPN-подключение</text><text x="787" y="259" font-size="18" fill="#b9ccdf" font-weight="400">Валидный VLESS → маршрутизация Xray</text><rect x="765" y="342" width="583" height="115" rx="16" fill="#15263b" stroke="#375069"/><text x="787" y="379" font-size="22" fill="#edf5fb" font-weight="600">Обычный HTTPS · nginx</text><text x="787" y="411" font-size="18" fill="#b9ccdf" font-weight="400">HTTP/1.1 → h1.sock  /  HTTP/2 → h2.sock</text><text x="787" y="439" font-size="18" fill="#b9ccdf" font-weight="400">Изолированная служба; без TCP-listener</text><path d="M297 286H365" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M650 255H713V238H755" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M650 310H713V400H755" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="765" y="522" width="583" height="102" rx="16" fill="#15263b" stroke="#375069"/><text x="787" y="559" font-size="22" fill="#edf5fb" font-weight="600">PokéHabitat · на той же ноде</text><text x="787" y="591" font-size="18" fill="#b9ccdf" font-weight="400">Статические файлы + локальный API + SQLite</text><path d="M1057 457V512" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="52" y="450" width="598" height="174" rx="16" fill="#15263b" stroke="#375069"/><text x="74" y="487" font-size="22" fill="#edf5fb" font-weight="600">Подготовка и обслуживание</text><text x="74" y="519" font-size="18" fill="#b9ccdf" font-weight="400">Remnawave Node в Docker · профиль для панели</text><text x="74" y="547" font-size="18" fill="#b9ccdf" font-weight="400">Auto Tuning · защита API · Traffic Control по выбору</text><text x="74" y="575" font-size="18" fill="#b9ccdf" font-weight="400">Let’s Encrypt · хуки и автоматическое продление</text><text x="52" y="675" font-size="20" fill="#b9ccdf" font-weight="400">Сначала подготовка сервера, затем применение TLS-профиля в панели и итоговая проверка.</text></g></svg>
