<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" role="img" aria-labelledby="title desc">
<title id="title">Auto Tuning</title><desc id="desc">Подготовка Linux, подтверждение плана, сетевой тюнинг, память, защита, обслуживание, итоговая диагностика и ручная перезагрузка при необходимости.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a47a29"/></marker></defs>
<style>text {font-family: 'Segoe UI',Arial,sans-serif} .body {fill:#475569;font-size:20px} .heading {fill:#172b40;font-size:25px;font-weight:700} .small {fill:#64748b;font-size:19px} .label {fill:#8b631e;font-size:18px;font-weight:700;letter-spacing:1.5px} .edge {fill:none;stroke:#a47a29;stroke-width:2.6;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1640" fill="#fbfaf7"/><rect x="0" y="0" width="1200" height="7" fill="#c29a45"/>

<text x="50" y="51" class="label">NUVRION  /  СХЕМА РАБОТЫ</text>
<text x="50" y="107" font-size="43" fill="#172b40" font-weight="700">Auto Tuning</text>
<text x="50" y="145" class="body">От диагностики ресурсов до проверки применённых настроек</text>
<text x="50" y="195" class="label">01  /  ДИАГНОСТИКА И ПЛАН</text>
<path d="M50 211 H1150" stroke="#e5dfd1" stroke-width="1.5"/>
<rect x="50" y="230" width="530" height="188" rx="18" fill="#ffffff" stroke="#deded8" stroke-width="1.6"/>
<text x="74" y="262" class="heading">Оценить состояние сервера</text>
<text x="74" y="298" class="body">CPU, RAM, ядро, диски и inode; сеть, sysctl, swap и</text>
<text x="74" y="324" class="body">доступные модули.</text>
<text x="74" y="355" class="body">Найти Xray / Remnawave, службы и действующий</text>
<text x="74" y="381" class="body">firewall.</text>
<rect x="620" y="230" width="530" height="188" rx="18" fill="#fff7e7" stroke="#d8bc78" stroke-width="1.6"/>
<text x="644" y="262" class="heading">Рассчитать и показать изменения</text>
<text x="644" y="298" class="body">Подобрать параметры по ресурсам и текущей</text>
<text x="644" y="324" class="body">конфигурации.</text>
<text x="644" y="355" class="body">Проверить конфликты; показать план и запросить</text>
<text x="644" y="381" class="body">согласие.</text>
<path class="edge" d="M 583 324 L 611 324"/>
<path class="edge" d="M 885 421 L 885 449"/>
<rect x="50" y="457" width="1100" height="119" rx="18" fill="#fff7e7" stroke="#d8bc78" stroke-width="1.6"/>
<text x="74" y="489" class="heading">Сохранить снимки конфигурации</text>
<text x="74" y="525" class="body">Перед применением сохраняются настройки. Снимки не заменяют резервную копию сервера.</text>
<path class="edge" d="M 600 580 L 600 605"/>
<text x="50" y="631" class="label">02  /  МОДУЛИ ВЫПОЛНЯЮТСЯ ПО ПЛАНУ И ДОСТУПНОСТИ КОМПОНЕНТОВ</text>
<path d="M50 647 H1150" stroke="#e5dfd1" stroke-width="1.5"/>
<rect x="50" y="672" width="530" height="222" rx="18" fill="#ffffff" stroke="#deded8" stroke-width="1.6"/>
<text x="74" y="704" class="label">СЕТЕВОЙ СТЕК</text>
<text x="74" y="736" class="heading">Сеть и conntrack</text>
<text x="74" y="772" class="body">BBR + fq; TCP/UDP buffers, backlog, MTU probing и</text>
<text x="74" y="798" class="body">локальные порты.</text>
<text x="74" y="829" class="body">Лимит и hash buckets conntrack; проверка загрузки</text>
<text x="74" y="855" class="body">таблицы.</text>
<rect x="620" y="672" width="530" height="222" rx="18" fill="#ffffff" stroke="#deded8" stroke-width="1.6"/>
<text x="644" y="704" class="label">РЕСУРСЫ</text>
<text x="644" y="736" class="heading">Память и лимиты ноды</text>
<text x="644" y="772" class="body">Найти или настроить ZRAM: размер, сжатие,</text>
<text x="644" y="798" class="body">приоритет и рабочий модуль.</text>
<text x="644" y="829" class="body">Проверить NOFILE, контейнер ноды и сетевое</text>
<text x="644" y="855" class="body">пространство имён.</text>
<rect x="50" y="920" width="530" height="222" rx="18" fill="#ffffff" stroke="#deded8" stroke-width="1.6"/>
<text x="74" y="952" class="label">ДОСТУП</text>
<text x="74" y="984" class="heading">SSH и защита сервера</text>
<text x="74" y="1020" class="body">Kernel hardening, Fail2ban; аудит SSH, UFW/nftables и</text>
<text x="74" y="1046" class="body">Docker socket.</text>
<text x="74" y="1077" class="body">Проверить публичные порты и ограничение API</text>
<text x="74" y="1103" class="body">адресами панели.</text>
<rect x="620" y="920" width="530" height="222" rx="18" fill="#ffffff" stroke="#deded8" stroke-width="1.6"/>
<text x="644" y="952" class="label">ОБСЛУЖИВАНИЕ</text>
<text x="644" y="984" class="heading">Системное обслуживание</text>
<text x="644" y="1020" class="body">Обновления безопасности, NTP, TRIM; состояние</text>
<text x="644" y="1046" class="body">диска и сертификатов.</text>
<text x="644" y="1077" class="body">Подготовить проверку после reboot, если она</text>
<text x="644" y="1103" class="body">включена.</text>
<path class="edge" d="M 600 1151 L 600 1194"/>
<rect x="50" y="1203" width="1100" height="146" rx="18" fill="#eef8f3" stroke="#adcebd" stroke-width="1.6"/>
<text x="74" y="1235" class="heading">Проверить фактический результат</text>
<text x="74" y="1271" class="body">Повторно проверить sysctl, BBR/qdisc, conntrack, ZRAM, ноду, firewall и службы.</text>
<text x="74" y="1302" class="body">Отчёт: готово / предупреждение / требуется действие. Повторный запуск выполняет диагностику.</text>
<path class="edge" d="M 600 1354 L 600 1388" stroke-dasharray="7 6"/>
<rect x="50" y="1397" width="1100" height="125" rx="18" fill="#fff7e7" stroke="#d8bc78" stroke-width="1.6"/>
<text x="74" y="1429" class="heading">Если требуется новое ядро — перезагрузка вручную</text>
<text x="74" y="1465" class="body">При включённой проверке после reboot: /var/lib/nuvrion-tuning/post-reboot-last.txt</text>
<path d="M50 1553 H1150" stroke="#d7c8a4" stroke-width="1.5"/>
<text x="50" y="1578" class="small">Условия: root · Ubuntu / Debian · проверенная резервная копия перед системными изменениями.</text>
<text x="50" y="1606" class="small">Xray и панель Remnawave устанавливаются отдельно. Пунктир — условный этап.</text>
</svg>
