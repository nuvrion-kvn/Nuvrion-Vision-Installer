<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf4ef"><meta name="description" content="PokéHabitat — клуб любителей покемонов">
<title>PokéHabitat — Клуб любителей покемонов</title>
<style>
:root{color-scheme:light;--text:#18392d;--muted:#586f60;--accent:#2e604b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 15% 10%,#b8d9c2,transparent 65%),linear-gradient(140deg,#e2f0e7,#c5ddce)}main{max-width:540px;padding:40px;border:1px solid #fff;border-radius:28px;background:#f8fffaad;backdrop-filter:blur(22px);box-shadow:0 20px 60px #193d2414;text-align:center}h1{font-size:32px;letter-spacing:-1px;margin:10px 0 20px}.brand{font-size:22px;font-weight:700}p{color:var(--muted)}a,button{font:inherit;border:1px solid var(--accent);border-radius:30px;padding:12px 22px;cursor:pointer}a{display:inline-block;background:var(--accent);color:white;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid #397c5c;outline-offset:4px}.languages{display:flex;gap:8px;justify-content:center;margin-top:26px}.languages button{background:#fff8;color:var(--text);min-height:44px}.languages button[aria-pressed=true]{background:var(--accent);color:white}[hidden]{display:none!important}@media(max-width:600px){main{padding:28px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body><main><div class="brand">pokéhabitat</div><div id="ru"><h1>Клуб временно недоступен</h1><p>Не удалось загрузить сайт. Попробуйте снова немного позже.</p><a href="/">Попробовать снова</a></div><div id="en" hidden><h1>The club is temporarily unavailable</h1><p>We could not load the site. Please try again in a moment.</p><a href="/">Try again</a></div><div class="languages" role="group" aria-label="Язык / Language"><button type="button" data-lang="ru" aria-pressed="true" lang="ru">RU</button><button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button></div></main>
<script>
for(const button of document.querySelectorAll('[data-lang]'))button.addEventListener('click',()=>{const lang=button.dataset.lang;document.documentElement.lang=lang;document.getElementById('ru').hidden=lang!=='ru';document.getElementById('en').hidden=lang!=='en';for(const control of document.querySelectorAll('[data-lang]'))control.setAttribute('aria-pressed',String(control===button));document.title=lang==='ru'?'PokéHabitat — Клуб любителей покемонов':'PokéHabitat — The Pokémon lovers’ club';});
</script></body></html>
