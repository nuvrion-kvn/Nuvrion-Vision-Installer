<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="Nuvrion Vision Installer — схема работы версии 1.0.0">
<title>Nuvrion Vision Installer — схема работы версии 1.0.0</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08121f"/><stop offset="1" stop-color="#162540"/></linearGradient><linearGradient id="accent"><stop stop-color="#71e5d5"/><stop offset="1" stop-color="#a5a4ff"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a8c9e8" stroke-opacity=".045"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#71e5d5" stroke-width="1.5"/></marker></defs>
