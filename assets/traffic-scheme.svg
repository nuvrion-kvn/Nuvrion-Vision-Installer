<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="Nuvrion Traffic Control — схема работы версии 1.0.0">
<title>Nuvrion Traffic Control — схема работы версии 1.0.0</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08121f"/><stop offset="1" stop-color="#162540"/></linearGradient><linearGradient id="accent"><stop stop-color="#71e5d5"/><stop offset="1" stop-color="#a5a4ff"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a8c9e8" stroke-opacity=".045"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#71e5d5" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="720" rx="26" fill="url(#bg)"/><rect width="1400" height="720" rx="26" fill="url(#grid)"/>
<g font-family="Segoe UI,DejaVu Sans,Arial,sans-serif"><text x="52" y="54" font-size="18" fill="#71e5d5" font-weight="600">NUVRION  /  1.0.0</text><text x="52" y="108" font-size="37" fill="#f5f9fc" font-weight="600">Traffic Control · схема работы</text><text x="52" y="147" font-size="22" fill="#b9ccdf" font-weight="400">Исключения администратора имеют приоритет над списками блокировки</text><rect x="52" y="205" width="335" height="162" rx="16" fill="#15263b" stroke="#375069"/><text x="74" y="242" font-size="22" fill="#edf5fb" font-weight="600">Источники правил</text><text x="74" y="274" font-size="18" fill="#b9ccdf" font-weight="400">antiscanner / government_networks</text><text x="74" y="302" font-size="18" fill="#b9ccdf" font-weight="400">skipa · ручные IP / CIDR</text><text x="74" y="330" font-size="18" fill="#b9ccdf" font-weight="400">Проверка и нормализация</text><rect x="478" y="205" width="365" height="162" rx="16" fill="#163336" stroke="#71e5d5"/><text x="500" y="242" font-size="22" fill="#71e5d5" font-weight="600">Локальное состояние</text><text x="500" y="274" font-size="18" fill="#b9ccdf" font-weight="400">Исключения SSH и панели</text><text x="500" y="302" font-size="18" fill="#b9ccdf" font-weight="400">IPv4 / IPv6 · разрешённые IP</text><text x="500" y="330" font-size="18" fill="#b9ccdf" font-weight="400">Сохранение списков и настроек</text><rect x="934" y="205" width="414" height="162" rx="16" fill="#15263b" stroke="#375069"/><text x="956" y="242" font-size="22" fill="#edf5fb" font-weight="600">nftables · inet nuvrion_tc</text><text x="956" y="274" font-size="18" fill="#b9ccdf" font-weight="400">Входящие пакеты → allowlist</text><text x="956" y="302" font-size="18" fill="#b9ccdf" font-weight="400">Блок-листы → журнал / DROP</text><text x="956" y="330" font-size="18" fill="#b9ccdf" font-weight="400">Остальной трафик → далее</text><path d="M387 286H468" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M843 286H924" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="52" y="454" width="335" height="135" rx="16" fill="#15263b" stroke="#375069"/><text x="74" y="491" font-size="22" fill="#edf5fb" font-weight="600">Обновление по таймеру</text><text x="74" y="523" font-size="18" fill="#b9ccdf" font-weight="400">Загрузка всех списков</text><text x="74" y="551" font-size="18" fill="#b9ccdf" font-weight="400">Применение после проверки</text><rect x="478" y="454" width="365" height="135" rx="16" fill="#15263b" stroke="#375069"/><text x="500" y="491" font-size="22" fill="#edf5fb" font-weight="600">Перезагрузка сервера</text><text x="500" y="523" font-size="18" fill="#b9ccdf" font-weight="400">Восстановление локальных правил</text><text x="500" y="551" font-size="18" fill="#b9ccdf" font-weight="400">Сеть не нужна для restore</text><rect x="934" y="454" width="414" height="135" rx="16" fill="#15263b" stroke="#375069"/><text x="956" y="491" font-size="22" fill="#edf5fb" font-weight="600">Управление · ntc</text><text x="956" y="523" font-size="18" fill="#b9ccdf" font-weight="400">Статус · журнал · диагностика</text><text x="956" y="551" font-size="18" fill="#b9ccdf" font-weight="400">Блокировки · исключения · on/off</text><path d="M218 454V387H661V377" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M661 454V377" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1141 454V377" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><text x="52" y="655" font-size="20" fill="#b9ccdf" font-weight="400">Совпадения определяются содержимым списков. Фильтрация не гарантирует защиту от всех сканеров.</text></g></svg>
