<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="Nuvrion Auto Tuning — схема работы версии 1.0.0">
<title>Nuvrion Auto Tuning — схема работы версии 1.0.0</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08121f"/><stop offset="1" stop-color="#162540"/></linearGradient><linearGradient id="accent"><stop stop-color="#71e5d5"/><stop offset="1" stop-color="#a5a4ff"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a8c9e8" stroke-opacity=".045"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#71e5d5" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="720" rx="26" fill="url(#bg)"/><rect width="1400" height="720" rx="26" fill="url(#grid)"/>
<g font-family="Segoe UI,DejaVu Sans,Arial,sans-serif"><text x="52" y="54" font-size="18" fill="#71e5d5" font-weight="600">NUVRION  /  1.0.0</text><text x="52" y="108" font-size="37" fill="#f5f9fc" font-weight="600">Auto Tuning · схема работы</text><text x="52" y="147" font-size="22" fill="#b9ccdf" font-weight="400">Диагностика → согласование → настройка → проверка результата</text><rect x="52" y="199" width="280" height="135" rx="16" fill="#15263b" stroke="#375069"/><text x="74" y="236" font-size="22" fill="#edf5fb" font-weight="600">01 · Диагностика</text><text x="74" y="268" font-size="18" fill="#b9ccdf" font-weight="400">CPU / RAM / ядро</text><text x="74" y="296" font-size="18" fill="#b9ccdf" font-weight="400">Сеть, службы и нода</text><rect x="382" y="199" width="280" height="135" rx="16" fill="#15263b" stroke="#375069"/><text x="404" y="236" font-size="22" fill="#edf5fb" font-weight="600">02 · Подготовка</text><text x="404" y="268" font-size="18" fill="#b9ccdf" font-weight="400">Подтверждение изменений</text><text x="404" y="296" font-size="18" fill="#b9ccdf" font-weight="400">Снимки и резервные копии</text><rect x="712" y="199" width="280" height="135" rx="16" fill="#163336" stroke="#71e5d5"/><text x="734" y="236" font-size="22" fill="#71e5d5" font-weight="600">03 · Настройка</text><text x="734" y="268" font-size="18" fill="#b9ccdf" font-weight="400">Параметры по ресурсам</text><text x="734" y="296" font-size="18" fill="#b9ccdf" font-weight="400">Контроль конфликтов</text><rect x="1042" y="199" width="306" height="135" rx="16" fill="#15263b" stroke="#375069"/><text x="1064" y="236" font-size="22" fill="#edf5fb" font-weight="600">04 · Итоговый отчёт</text><text x="1064" y="268" font-size="18" fill="#b9ccdf" font-weight="400">Проверка фактического состояния</text><text x="1064" y="296" font-size="18" fill="#b9ccdf" font-weight="400">Готово / предупреждение</text><path d="M332 266H372" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M662 266H702" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M992 266H1032" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="52" y="421" width="280" height="140" rx="16" fill="#15263b" stroke="#375069"/><text x="74" y="458" font-size="22" fill="#edf5fb" font-weight="600">Сеть и ядро</text><text x="74" y="490" font-size="18" fill="#b9ccdf" font-weight="400">BBR / fq · TCP / UDP</text><text x="74" y="518" font-size="18" fill="#b9ccdf" font-weight="400">sysctl · conntrack</text><rect x="382" y="421" width="280" height="140" rx="16" fill="#15263b" stroke="#375069"/><text x="404" y="458" font-size="22" fill="#edf5fb" font-weight="600">Память и нагрузка</text><text x="404" y="490" font-size="18" fill="#b9ccdf" font-weight="400">ZRAM · VM-параметры</text><text x="404" y="518" font-size="18" fill="#b9ccdf" font-weight="400">NOFILE · лимиты ноды</text><rect x="712" y="421" width="280" height="140" rx="16" fill="#15263b" stroke="#375069"/><text x="734" y="458" font-size="22" fill="#edf5fb" font-weight="600">Защита</text><text x="734" y="490" font-size="18" fill="#b9ccdf" font-weight="400">SSH-аудит · Fail2ban</text><text x="734" y="518" font-size="18" fill="#b9ccdf" font-weight="400">UFW / nftables · API панели</text><rect x="1042" y="421" width="306" height="140" rx="16" fill="#15263b" stroke="#375069"/><text x="1064" y="458" font-size="22" fill="#edf5fb" font-weight="600">Обслуживание</text><text x="1064" y="490" font-size="18" fill="#b9ccdf" font-weight="400">NTP · диск · сертификаты</text><text x="1064" y="518" font-size="18" fill="#b9ccdf" font-weight="400">Проверка после reboot</text><path d="M852 334V384H192V411" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M522 384V411" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M852 384V411" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M852 384H1195V411" fill="none" stroke="#71e5d5" stroke-width="2.5" marker-end="url(#arrow)"/><text x="52" y="636" font-size="21" fill="#b9ccdf" font-weight="400">Зависимости устанавливаются по условиям скрипта; перезагрузка выполняется вручную.</text><text x="52" y="676" font-size="19" fill="#819bb8" font-weight="400">Снимок настроек помогает восстановлению; полного автоматического отката системы нет.</text></g></svg>
